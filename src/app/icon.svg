<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Precision Ground: BMW Corporate Blue -->
  <rect width="48" height="48" fill="#1c69d4"/>
  
  <!-- Aerodynamic Modern Transit Coach Silhouette -->
  <g transform="translate(4, 4)">
    <!-- Main Coach Shell Frame -->
    <path
      d="M10 11C10 9.34 11.34 8 13 8H27C28.66 8 30 9.34 30 11L28.8 28.5C28.8 29.88 27.68 31 26.3 31H13.7C12.32 31 11.2 29.88 11.2 28.5L10 11Z"
      stroke="#ffffff"
      stroke-width="2"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Panoramic Curved Windshield -->
    <path
      d="M12 11.5C12 10.67 12.67 10 13.5 10H26.5C27.33 10 28 10.67 28 11.5L27.2 20.5H12.8L12 11.5Z"
      fill="rgba(255, 255, 255, 0.28)"
      stroke="#ffffff"
      stroke-width="1.2"
    />

    <!-- Digital Route Matrix Bar -->
    <rect x="15" y="11.5" width="10" height="2" fill="#93c5fd"/>

    <!-- High-Tech LED Horizontal Light Blades -->
    <line x1="12.5" y1="24.5" x2="17.5" y2="24.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="22.5" y1="24.5" x2="27.5" y2="24.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Dynamic VIT-AP "V" Grille Emblem -->
    <path d="M18.5 23.5L20 26.5L21.5 23.5" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Aerodynamic Chassis Stance -->
    <line x1="13.5" y1="29" x2="17" y2="29" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="23" y1="29" x2="26.5" y2="29" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Signature M-Tricolor Racing/Speed Baseline Stripe -->
  <rect x="0" y="45" width="16" height="3" fill="#0066b1"/>
  <rect x="16" y="45" width="16" height="3" fill="#ffffff"/>
  <rect x="32" y="45" width="16" height="3" fill="#e22718"/>
</svg>
